kind = "data-app"
previewPath = "/"
title = "Business School Dean Leadership Dashboard"
version = "1.0.0"
id = "artifacts/dean-dashboard"
router = "path"

[[integratedSkills]]
name = "data-visualization"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22489

[services.development]
run = "pnpm --filter @workspace/dean-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dean-dashboard", "run", "build" ]
publicDir = "artifacts/dean-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22489"
BASE_PATH = "/"
