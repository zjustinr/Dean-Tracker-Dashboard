name: Daily dean-news scout

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC (~9am ET)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: news-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install xlsx (only dependency the scout needs)
        run: npm install --ignore-scripts --no-save --no-package-lock xlsx@0.18.5

      - name: Run news scout
        id: scout
        run: |
          node artifacts/dean-dashboard/scripts/news-scout.mjs | tee scout-output.txt
          if grep -q '^CHANGED$' scout-output.txt; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit and push updates
        run: |
          git config user.name "dean-news-scout"
          git config user.email "actions@github.com"
          git add attached_assets/Dean_Data_Collection_R1_v7_verified.xlsx \
                  attached_assets/news_scout_state.json \
                  attached_assets/news_scout_review.json \
                  attached_assets/news_scout_log.csv \
                  attached_assets/enrichment_queue.json \
                  artifacts/dean-dashboard/src/data/ \
                  artifacts/dean-dashboard/public/deans/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "news-scout: daily dean-appointment scan $(date -u +%F)"
            git push
          fi

      # Email the owner a digest of pending (medium-confidence) items with signed
      # Approve/Dismiss links. Runs every day; no-op if the queue is empty or the
      # RESEND_API_KEY / APPROVE_SECRET secrets aren't set yet.
      - name: Send review digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APPROVE_SECRET: ${{ secrets.APPROVE_SECRET }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          DIGEST_FROM: ${{ vars.DIGEST_FROM }}
        run: node artifacts/dean-dashboard/scripts/news-digest.mjs || true

      - name: Job summary
        run: |
          {
            echo "## Dean news scout — $(date -u +%F)"
            echo '```'
            cat scout-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
