name: CI

on:
  pull_request:
    paths:
      - "artifacts/dean-dashboard/src/data/**.json"
      - "artifacts/dean-dashboard/scripts/lib/tenure.mjs"
      - "artifacts/dean-dashboard/scripts/validate-*.mjs"
      - "artifacts/dean-dashboard/scripts/lib/departure.mjs"

jobs:
  validate-source-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need base-branch history so the diff-based check can read it

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check every new/changed record has a sourceUrl
        run: node artifacts/dean-dashboard/scripts/validate-source-urls.mjs --base "origin/${{ github.base_ref }}"

  validate-tenure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Not diff-based: the corpus is clean, so any impossible tenure -- a sitting
      # leader carrying a stored length, a negative span, a placeholder year, a
      # spell longer than a career -- is a regression wherever it appears.
      - name: Check no record carries impossible tenure arithmetic
        run: node artifacts/dean-dashboard/scripts/validate-tenure.mjs

  validate-departures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The interim-to-permanent flags are stored (a conversion is a property of a
      # pair of spells, so one record cannot compute it), which means they need a
      # check that they still match the derivation that produced them.
      - name: Check stored conversion flags match the derivation
        run: node artifacts/dean-dashboard/scripts/validate-departures.mjs
